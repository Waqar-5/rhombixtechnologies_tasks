<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="720" fill="#ffffff"/>

  <!-- shared wireframe block style helper drawn manually per screen -->

  <!-- SCREEN 1: HOME -->
  <g transform="translate(20,20)">
    <rect width="290" height="640" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="-6" font-size="13" fill="#333" font-weight="bold">01 · Home</text>
    <rect x="10" y="10" width="270" height="30" fill="#e5e5e5" stroke="#aaa"/>
    <text x="20" y="30" font-size="9" fill="#666">LOGO        SEARCH   TRIPS   SIGN IN</text>
    <rect x="10" y="50" width="270" height="150" fill="#eee" stroke="#aaa"/>
    <text x="20" y="70" font-size="9" fill="#666">HEADLINE TEXT</text>
    <line x1="20" y1="85" x2="180" y2="85" stroke="#bbb"/>
    <line x1="20" y1="98" x2="150" y2="98" stroke="#bbb"/>
    <rect x="20" y="115" width="90" height="20" fill="#ccc" stroke="#999"/>
    <text x="27" y="128" font-size="8" fill="#555">SEARCH →</text>
    <rect x="150" y="60" width="120" height="130" fill="#ddd" stroke="#999"/>
    <text x="165" y="128" font-size="8" fill="#666">3D HERO</text>
    <rect x="10" y="210" width="270" height="90" fill="#f4f4f4" stroke="#aaa"/>
    <text x="20" y="225" font-size="9" fill="#666">DEPARTURE BOARD LIST</text>
    <line x1="20" y1="240" x2="260" y2="240" stroke="#ccc"/>
    <line x1="20" y1="255" x2="260" y2="255" stroke="#ccc"/>
    <line x1="20" y1="270" x2="260" y2="270" stroke="#ccc"/>
    <line x1="20" y1="285" x2="260" y2="285" stroke="#ccc"/>
    <text x="10" y="320" font-size="9" fill="#666">FEATURED DESTINATIONS</text>
    <rect x="10" y="330" width="128" height="80" fill="#eee" stroke="#aaa"/>
    <rect x="152" y="330" width="128" height="80" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="420" width="128" height="80" fill="#eee" stroke="#aaa"/>
    <rect x="152" y="420" width="128" height="80" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="560" width="270" height="70" fill="#e5e5e5" stroke="#aaa"/>
    <text x="20" y="580" font-size="8" fill="#777">FOOTER</text>
  </g>

  <!-- SCREEN 2: SEARCH -->
  <g transform="translate(340,20)">
    <rect width="290" height="640" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="-6" font-size="13" fill="#333" font-weight="bold">02 · Search</text>
    <rect x="10" y="10" width="270" height="30" fill="#e5e5e5" stroke="#aaa"/>
    <rect x="10" y="55" width="270" height="45" fill="#eee" stroke="#aaa"/>
    <text x="20" y="72" font-size="8" fill="#666">SEARCH INPUT</text>
    <rect x="20" y="80" width="40" height="14" fill="#ddd" stroke="#999"/>
    <rect x="65" y="80" width="40" height="14" fill="#ddd" stroke="#999"/>
    <rect x="110" y="80" width="40" height="14" fill="#ddd" stroke="#999"/>
    <text x="10" y="120" font-size="9" fill="#666">RESULTS GRID</text>
    <rect x="10" y="130" width="128" height="110" fill="#eee" stroke="#aaa"/>
    <rect x="152" y="130" width="128" height="110" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="250" width="128" height="110" fill="#eee" stroke="#aaa"/>
    <rect x="152" y="250" width="128" height="110" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="370" width="128" height="110" fill="#eee" stroke="#aaa"/>
    <rect x="152" y="370" width="128" height="110" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="560" width="270" height="70" fill="#e5e5e5" stroke="#aaa"/>
  </g>

  <!-- SCREEN 3: DESTINATION DETAIL -->
  <g transform="translate(660,20)">
    <rect width="290" height="640" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="-6" font-size="13" fill="#333" font-weight="bold">03 · Destination detail</text>
    <rect x="10" y="10" width="270" height="90" fill="#ddd" stroke="#999"/>
    <text x="20" y="30" font-size="9" fill="#555">HERO IMAGE + CITY TITLE</text>
    <rect x="10" y="110" width="270" height="35" fill="#eee" stroke="#aaa"/>
    <text x="20" y="128" font-size="8" fill="#666">DATES + GUESTS</text>
    <text x="10" y="162" font-size="9" fill="#666">CHOOSE FLIGHT</text>
    <rect x="10" y="170" width="270" height="40" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="215" width="270" height="40" fill="#eee" stroke="#aaa"/>
    <text x="10" y="272" font-size="9" fill="#666">CHOOSE STAY</text>
    <rect x="10" y="280" width="270" height="55" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="340" width="270" height="55" fill="#eee" stroke="#aaa"/>
    <rect x="10" y="410" width="270" height="150" fill="#e0e0e0" stroke="#999"/>
    <text x="20" y="428" font-size="9" fill="#555">TRIP SUMMARY (sticky)</text>
    <line x1="20" y1="440" x2="260" y2="440" stroke="#bbb"/>
    <line x1="20" y1="452" x2="260" y2="452" stroke="#bbb"/>
    <line x1="20" y1="464" x2="260" y2="464" stroke="#bbb"/>
    <rect x="20" y="500" width="240" height="24" fill="#ccc" stroke="#999"/>
    <text x="80" y="516" font-size="8" fill="#555">CONTINUE TO BOOKING</text>
  </g>

  <!-- SCREEN 4: BOOKING -->
  <g transform="translate(980,20)">
    <rect width="290" height="640" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="-6" font-size="13" fill="#333" font-weight="bold">04 · Booking / payment</text>
    <rect x="10" y="10" width="270" height="30" fill="#e5e5e5" stroke="#aaa"/>
    <text x="10" y="65" font-size="9" fill="#666">PASSENGER DETAILS</text>
    <rect x="10" y="72" width="270" height="45" fill="#eee" stroke="#aaa"/>
    <text x="10" y="140" font-size="9" fill="#666">PAYMENT</text>
    <rect x="10" y="148" width="270" height="120" fill="#eee" stroke="#aaa"/>
    <line x1="20" y1="170" x2="260" y2="170" stroke="#bbb"/>
    <line x1="20" y1="190" x2="140" y2="190" stroke="#bbb"/>
    <line x1="150" y1="190" x2="260" y2="190" stroke="#bbb"/>
    <rect x="20" y="290" width="260" height="26" fill="#ccc" stroke="#999"/>
    <text x="90" y="307" font-size="8" fill="#555">PAY &amp; CONFIRM</text>
    <text x="10" y="345" font-size="9" fill="#666">ORDER SUMMARY (sticky)</text>
    <rect x="10" y="352" width="270" height="180" fill="#e0e0e0" stroke="#999"/>
    <rect x="10" y="560" width="270" height="70" fill="#e5e5e5" stroke="#aaa"/>
  </g>

  <!-- SCREEN 5: CONFIRMATION -->
  <g transform="translate(1300,20)">
    <rect width="280" height="640" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="10" y="-6" font-size="13" fill="#333" font-weight="bold">05 · Confirmation</text>
    <rect x="10" y="10" width="260" height="30" fill="#e5e5e5" stroke="#aaa"/>
    <text x="20" y="70" font-size="9" fill="#666" text-anchor="start">"YOU'RE ALL BOOKED" HEADER</text>
    <rect x="10" y="90" width="260" height="140" fill="#ddd" stroke="#999"/>
    <text x="20" y="110" font-size="8" fill="#555">BOARDING PASS</text>
    <line x1="20" y1="130" x2="200" y2="130" stroke="#bbb"/>
    <line x1="20" y1="145" x2="180" y2="145" stroke="#bbb"/>
    <line x1="220" y1="90" x2="220" y2="230" stroke="#999" stroke-dasharray="3,3"/>
    <text x="228" y="160" font-size="7" fill="#666" writing-mode="tb">STUB</text>
    <rect x="60" y="250" width="70" height="22" fill="#ccc" stroke="#999"/>
    <text x="66" y="264" font-size="7" fill="#555">MY TRIPS</text>
    <rect x="150" y="250" width="90" height="22" fill="#eee" stroke="#999"/>
    <text x="158" y="264" font-size="7" fill="#555">BOOK ANOTHER</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="310" y1="340" x2="336" y2="340"/>
    <line x1="630" y1="340" x2="656" y2="340"/>
    <line x1="950" y1="340" x2="976" y2="340"/>
    <line x1="1270" y1="340" x2="1296" y2="340"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
